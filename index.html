<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Biometric Messaging System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Secure Biometric Messaging System</h1>
        <p>LiteHash-Based Key Derivation and Message Authentication</p>
        <button class="theme-switcher" id="theme-switcher" title="Toggle Theme">
            <!-- Icons will be swapped by JS -->
        </button>
    </header>

    <div class="container">
        <div class="main-layout">

            <div class="left-column">
                <div id="auth-container" class="card">
                    <div class="tabs">
                        <button id="show-login-btn" class="tab-button active">Login</button>
                        <button id="show-register-btn" class="tab-button">Register</button>
                    </div>
                    <form id="login-form">
                        <h2 class="form-title">User Login</h2>
                        <div class="form-group"><label for="login-username" class="form-label">Username</label><input type="text" id="login-username" required class="form-control"></div>
                        <div class="form-group"><label for="login-bio" class="form-label">Biometric Key (3 numbers, 0-255)</label><input type="text" id="login-bio" placeholder="e.g., 10, 20, 30" required class="form-control"></div>
                        <div class="form-group" style="display: flex; align-items: center;"><input type="checkbox" id="login-noise" style="width: 1rem; height: 1rem;"><label for="login-noise" style="margin-left: 0.5rem; font-size: 0.875rem;">Simulate noisy reading</label></div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                    <form id="register-form" class="hidden">
                        <h2 class="form-title">Register New User</h2>
                        <div class="form-group"><label for="register-username" class="form-label">Username</label><input type="text" id="register-username" required class="form-control"></div>
                        <div class="form-group"><label for="register-bio" class="form-label">Ideal Biometric Key (3 numbers, 0-255)</label><input type="text" id="register-bio" placeholder="e.g., 10, 20, 30" required class="form-control"></div>
                        <button type="submit" class="btn btn-success">Register New User</button>
                    </form>
                </div>
                
                <div id="post-message-container" class="card hidden" style="margin-top: 2rem;">
                    <h2 class="card-title">Post a Secure Message</h2>
                    <p style="color: var(--text-muted-light); margin-top: 0.25rem;">Welcome, <span id="current-user-name" style="font-weight: 600;"></span>!</p>
                    <form id="post-message-form" style="margin-top: 1rem;">
                        <textarea id="message-text" rows="4" placeholder="Write your message here..." required class="form-control"></textarea>
                        <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                            <button type="submit" class="btn btn-primary" style="width: auto;">Post Message</button>
                            <button type="button" id="logout-btn" style="background: none; border: none; color: var(--text-muted-light); cursor: pointer; font-weight: 500;">Logout</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="right-column">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Message Board</h2>
                        <button id="clear-data-btn" class="btn btn-danger" style="width: auto; padding: 0.25rem 0.75rem; font-size: 0.875rem;">Clear All Data</button>
                    </div>
                    <div id="message-board" class="message-board">
                        <p style="text-align: center; padding: 2rem 0; color: var(--text-muted-light);">No messages yet. Register and log in to post the first message!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
